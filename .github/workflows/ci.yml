name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # TS 7 (the native compiler) isn't yet supported by typescript-eslint, so
      # the project pins TS 6.0.x; that peer mismatch needs legacy-peer-deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # typecheck + lint + build + unit tests, the same gate as `npm run check`.
      - name: Typecheck, lint, build, test
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Cache the downloaded browser (~150MB) keyed on the lockfile, so it's only
      # re-downloaded when @playwright/test changes — the biggest CI-minute cost.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache miss: download the full Chromium (not headless_shell) plus OS deps.
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: browser is restored; just ensure the OS libraries it needs.
      - name: Install Playwright OS deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Builds dist/ then runs the popup smoke tests. PW_CHROMIUM_PATH is left
      # unset so Playwright uses the browser from the cache/install above.
      - name: Popup smoke tests
        run: npm run test:e2e
