name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # TS 7 (the native compiler) isn't yet supported by typescript-eslint, so
      # the project pins TS 6.0.x; that peer mismatch needs legacy-peer-deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # typecheck + lint + build + unit tests, the same gate as `npm run check`.
      - name: Typecheck, lint, build, test
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Full Chromium (not headless_shell) so the extension can load.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds dist/ then runs the popup smoke tests. PW_CHROMIUM_PATH is left
      # unset so Playwright uses the browser it just installed.
      - name: Popup smoke tests
        run: npm run test:e2e
